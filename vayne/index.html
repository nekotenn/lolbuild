<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>ヴェイン試合メモ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=JetBrains+Mono:wght@500;700&family=Cinzel:wght@600&display=swap">
<style>
/* Layout: 縦向きサブモニター1画面。#01 対面（いちばん大きい）→ #02 ビルド → #03 時間 → #04 集団戦。
   黒地に銀、深紅は「危険と番号」だけ。枠は罫線1本、カードは中身1つ。スクロールなし。 */
:root{
  --bg:#0a0a0d;        /* 夜 */
  --surface:#111117;   /* 面 */
  --line:#24242d;      /* 罫線 */
  --silver:#c8cdd5;    /* 本文 */
  --white:#f1f3f6;     /* 数字・強調 */
  --mute:#6f7480;      /* 補助 */
  --crimson:#c4213f;   /* アクセント：番号・不利・次に買う物 */
  --good:#4fb38a;      /* 有利（意味の色） */
  --jp:"Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --mark:"Cinzel","Trajan Pro",serif;
  color-scheme:dark;
  font-size:clamp(10px,min(1.08vh,2.15vw),22px);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;background:var(--bg);color:var(--silver)}
body{margin:0;font-family:var(--jp);line-height:1.4;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:1rem}
.board{height:100%;max-width:64rem;margin:0 auto;display:grid;grid-template-rows:auto auto auto 1fr auto auto;gap:1.1rem}
.lbl{font-family:var(--mono);font-size:.82rem;letter-spacing:.16em;color:var(--mute);text-transform:uppercase;display:flex;gap:.6rem;align-items:baseline;margin:0 0 .55rem}
.lbl i{font-style:normal;color:var(--crimson)}
.lbl em{font-style:normal;margin-left:auto;letter-spacing:.06em;text-transform:none}
section{border-top:1px solid var(--line);padding-top:.8rem;min-width:0}

/* バー */
.bar{display:flex;align-items:center;gap:1rem;font-family:var(--mono);font-size:.85rem;color:var(--mute)}
.bar .mark{font-family:var(--mark);font-size:1.7rem;letter-spacing:.32em;color:var(--white)}
.link{margin-left:auto;display:inline-flex;align-items:center;gap:.5rem;border:1px solid var(--line);padding:.25rem .7rem;border-radius:2px;color:var(--silver)}
.link i{width:.55rem;height:.55rem;border-radius:50%;background:var(--mute)}
.link.cs i{background:#d9a441}.link.live i{background:var(--good);box-shadow:0 0 .5rem var(--good)}
.link button{background:none;border:0;color:var(--crimson);font:inherit;cursor:pointer;text-decoration:underline;padding:0}

/* #01 対面 */
.mu{display:grid;grid-template-columns:auto minmax(0,1fr);gap:1.4rem;align-items:stretch}
.verdict{display:flex;flex-direction:column;justify-content:center;padding-right:1.4rem;border-right:1px solid var(--line);min-width:9rem}
.verdict b{font-size:4.6rem;font-weight:900;line-height:1;color:var(--white);letter-spacing:.04em}
.verdict b.P{color:var(--crimson)}.verdict b.E{color:var(--good)}
.verdict span{font-family:var(--mono);font-size:.8rem;color:var(--mute);margin-top:.5rem}
.foes{display:grid;grid-template-rows:1fr 1fr;gap:.7rem;min-width:0}
.foe{display:grid;grid-template-columns:4.6rem minmax(0,1fr);gap:.9rem;align-items:center;cursor:default;min-width:0}
.foe img,.foe .ph{width:4.6rem;height:4.6rem;border-radius:2px;border:1px solid var(--line);display:block}
.foe .ph{display:grid;place-items:center;color:var(--mute);font-family:var(--mono);font-size:.75rem}
.foe.P img{border-color:var(--crimson)}.foe.E img{border-color:var(--good)}
.foe .hd{display:flex;align-items:baseline;gap:.7rem;flex-wrap:wrap}
.foe .nm{font-size:1.5rem;font-weight:700;color:var(--white)}
.foe .wr{font-family:var(--mono);font-size:1.05rem;color:var(--silver)}
.foe.P .wr{color:var(--crimson)}.foe.E .wr{color:var(--good)}
.foe .tg{font-family:var(--mono);font-size:.72rem;color:var(--mute);border:1px solid var(--line);padding:.05rem .35rem}
.foe .tip{font-size:1.08rem;color:var(--silver);margin-top:.15rem}
.foe .r{font-size:.95rem;color:var(--mute)}
.foe .r b{font-family:var(--mono);color:var(--crimson);font-weight:700;margin-right:.35rem}

/* #02 ビルド */
.bd{display:flex;flex-wrap:wrap;align-items:flex-start;gap:.8rem 1.6rem}
.grp{display:flex;align-items:flex-start;gap:.35rem}
.it{display:flex;flex-direction:column;align-items:center;width:4.4rem;text-align:center;position:relative}
.it img{width:3.3rem;height:3.3rem;border:1px solid var(--line);border-radius:2px;display:block}
.it.ks img{border-radius:50%;width:3.6rem;height:3.6rem}
.it.rn img{border-radius:50%;width:2.5rem;height:2.5rem;margin-top:.55rem}
.it small{font-size:.74rem;color:var(--mute);white-space:nowrap;margin-top:.2rem}
.it .g{font-family:var(--mono);font-size:.72rem;color:var(--mute)}
.it.own{opacity:.35}
.it.own::after{content:"✓";position:absolute;top:.1rem;right:.55rem;font-size:.9rem;color:var(--good)}
.it.next img{border:2px solid var(--crimson)}
.it.next small{color:var(--white)}
.it.swap img{border:2px solid var(--white)}
.chev{color:var(--mute);font-family:var(--mono);align-self:center;margin-top:-1.4rem}
.vsep{width:1px;align-self:stretch;background:var(--line)}
.why{font-size:.85rem;color:var(--silver);max-width:13rem;align-self:center;line-height:1.35}
.why b{display:block;font-family:var(--mono);font-size:.72rem;letter-spacing:.12em;color:var(--mute);font-weight:500}
.gold{display:flex;align-items:center;gap:.8rem;margin-top:.6rem;font-family:var(--mono);font-size:.95rem}
.gold .barx{flex:1;height:.35rem;background:var(--line);position:relative}
.gold .barx i{position:absolute;inset:0 auto 0 0;background:var(--crimson)}
.gold b{color:var(--white)}

/* #03 時間 */
.tm{display:flex;flex-direction:column;min-height:0}
.tm ol{list-style:none;margin:0;padding:0;flex:1;min-height:0;display:grid;align-content:space-evenly}
.tm li{display:grid;grid-template-columns:6.4rem minmax(0,1fr);gap:1rem;align-items:baseline;padding:.35rem 0 .35rem .8rem;border-left:2px solid transparent}
.tm li .t{font-family:var(--mono);font-size:1.75rem;font-weight:700;color:var(--mute);text-align:right;line-height:1}
.tm li .a{font-size:1.35rem;color:var(--silver);line-height:1.3}
.tm li .a span{display:block;font-size:1rem;color:var(--mute)}
.tm li.now{border-left-color:var(--crimson);background:linear-gradient(90deg,#c4213f1f,transparent 70%)}
.tm li.now .t{color:var(--white)}
.tm li.now .a{color:var(--white);font-weight:700}
.tm li.done{opacity:.4}
.clock{font-family:var(--mono);font-size:1.2rem;color:var(--white);letter-spacing:.06em}

/* #04 集団戦 */
.tf{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1rem}
.tf div{border-top:2px solid var(--line);padding-top:.4rem}
.tf div:nth-child(3){border-color:var(--crimson)}
.tf b{display:block;font-size:1.35rem;font-weight:900;color:var(--white)}
.tf span{font-size:.9rem;color:var(--mute);line-height:1.3;display:block}
.chk{font-family:var(--mono);font-size:.85rem;color:var(--mute);margin-top:.6rem;display:flex;gap:1.4rem;flex-wrap:wrap}
.chk span::before{content:"[ ] ";color:var(--crimson)}

/* 手動 */
.manual{display:flex;align-items:center;gap:.8rem;font-family:var(--mono);font-size:.8rem;color:var(--mute)}
.manual input{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);color:var(--white);font:inherit;font-family:var(--jp);font-size:.95rem;padding:.4rem .7rem;border-radius:2px}
.manual input:focus-visible{outline:1px solid var(--crimson)}
.ex{color:var(--crimson)}
@media (max-width:560px){.mu{grid-template-columns:1fr}.verdict{border-right:0;padding:0}.tf{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>

<div class="board">
  <header class="bar">
    <span class="mark">VAYNE</span><span>BOT ・ 26.20</span>
    <span class="link" id="link"><i></i><span id="linkmsg">連携なし（PCのLoL連携で自動）</span></span>
  </header>

  <section aria-label="対面">
    <p class="lbl"><i>#01</i>MATCHUP<em id="exmark"></em></p>
    <div class="mu">
      <div class="verdict"><b id="vword">—</b><span id="vsub">相手ボットとの相性</span></div>
      <div class="foes"><div class="foe" id="foe-adc"></div><div class="foe" id="foe-sup"></div></div>
    </div>
  </section>

  <section aria-label="ビルド">
    <p class="lbl"><i>#02</i>BUILD<em>op.gg 26.20 エメラルド以上</em></p>
    <div class="bd" id="bd"></div>
    <div class="gold" id="gold" hidden></div>
  </section>

  <section class="tm" aria-label="時間">
    <p class="lbl"><i>#03</i>TIME<em class="clock" id="clock">ゲーム内の時計で見る</em></p>
    <ol id="tl"></ol>
  </section>

  <section aria-label="集団戦">
    <p class="lbl"><i>#04</i>TEAMFIGHT<em>R中はQのたびに役を入れ替える</em></p>
    <div class="tf">
      <div><b>見せる</b><span>射程の端、味方CCの近くで殴る</span></div>
      <div><b>釣る</b><span>スキルと突進を自分に撃たせる。Qは持つ</span></div>
      <div><b>消える</b><span>逆へ歩いて見せ、RQで反対へ</span></div>
      <div><b>撃つ</b><span>一拍置いて別の角度から。W3発で次</span></div>
    </div>
    <div class="chk"><span>殺せるスキルは使われた</span><span>ワード・範囲・敵タワーの外</span><span>Q1回で届く → キャリー</span></div>
  </section>

  <div class="manual" id="manual">
    <label for="q">手動</label>
    <input id="q" list="names" autocomplete="off" placeholder="相手のADCかサポートの名前を入れてEnter">
    <datalist id="names"></datalist>
  </div>
</div>

/* ---------- 判定 ---------- */
function analyze(){
  const a=S.adc?muOf(S.adc,"adc"):null, s=S.sup?muOf(S.sup,"sup"):null;
  const val=m=>m?(m.cls==="E"?1:m.cls==="P"?-1:0):0;
  const sc=val(a)+val(s);
  const v=!a&&!s?null:sc>=1?"E":sc<=-1?"P":"N";
  const bot=[a,s].filter(Boolean);
  const others=TEAM.filter(id=>id!==S.adc&&id!==S.sup);
  const all=[...new Set([...bot.map(m=>m.id),...others])];
  const flag=(m,x)=>m&&m.f.includes(x);
  const cc=bot.filter(m=>flag(m,"c")).length;
  const healers=all.filter(id=>ALLBYID[id]&&ALLBYID[id][5]).map(id=>ALLBYID[id][1]);
  const assassins=others.filter(id=>ALLBYID[id]&&ALLBYID[id][3]).map(id=>ALLBYID[id][1]);
  const burst=bot.some(m=>flag(m,"b"))||assassins.length>0;
  const tanks=all.filter(id=>TANKS.has(id));
  const swaps=[];
  if(healers.length) swaps.push(["3033","回復",healers.slice(0,2).join("・")]);
  if(burst) swaps.push(["6673","バースト",assassins[0]||bot.find(m=>flag(m,"b")).n]);
  if(tanks.length>=2) swaps.push(["3036","タンク",tanks.length+"体"]);
  if(cc>=2) swaps.push(["3139","CC","ボット2人とも"]);
  let spell=["s_SummonerFlash","s_SummonerBarrier"], alt=null;
  if(assassins.length) alt=["s_SummonerExhaust","イグゾースト",assassins[0]];
  else if(cc>=2&&bot.some(m=>m.cls==="P")) alt=["s_SummonerBoost","クレンズ","捕まえ役が苦手"];
  return {a,s,v,swaps:swaps.slice(0,2),spell,alt};
}

  if(e.key!=="Enter")return; const q=norm(e.target.value); if(!q)return;
  const m=MU.find(x=>norm(x.n)===q)||MU.find(x=>norm(x.n).startsWith(q))||MU.find(x=>x.id.toLowerCase().startsWith(q));
  if(!m)return;
  if(isExample){S={adc:null,sup:null};TEAM=[];isExample=false}
  S[m.role]=m.id; if(LOCAL)LINK.manual=true; e.target.value=""; lastSig=""; renderIfChanged();
});
["adc","sup"].forEach(k=>$("foe-"+k).addEventListener("dblclick",()=>{S[k]=null;isExample=false;if(LOCAL)LINK.manual=true;lastSig="";renderIfChanged()}));

/* ---------- LoL連携（PCのローカルサーバーから開いたときだけ動く。スウェイン対面ボードと同じ /api/live・/api/cs） ---------- */
function idFromRaw(raw,name){
  if(raw){const m=String(raw).match(/displayname_([A-Za-z]+)/);if(m&&ALLBYID[m[1]])return m[1]}
  const f=Object.values(ALLCH).find(c=>c[1]===name||c[0]===name);return f?f[0]:null;
}
function assignBot(ids,pos){
  let adc=null,sup=null;
  if(pos)ids.forEach(id=>{if(pos[id]==="BOTTOM")adc=id;if(pos[id]==="UTILITY")sup=id});
  const pool=ids.filter(id=>id!==adc&&id!==sup);
  if(!adc)adc=pool.find(id=>MUA.some(m=>m.id===id)&&!MUS.some(m=>m.id===id))||pool.find(id=>MUA.some(m=>m.id===id))||null;
  if(!sup)sup=pool.find(id=>id!==adc&&MUS.some(m=>m.id===id)&&!MUA.some(m=>m.id===id))||pool.find(id=>id!==adc&&MUS.some(m=>m.id===id))||null;
  return {adc,sup};
}
function applyAuto(ids,pos){
  if(!LINK.manual){S=assignBot(ids,pos);TEAM=ids;isExample=false}
  renderIfChanged();
}
function handleCS(s){
  const toId=k=>ALLCH[String(k)]?ALLCH[String(k)][0]:null;
  const enemy=(s.theirTeam||[]).map(p=>toId(p.championId)).filter(Boolean);
  LINK.mode="cs";LINK.live=null;LINK.msg="チャンピオン選択中 ・ 相手 "+enemy.length+"/5";
  applyAuto(enemy,null);
}
function handleLive(d){
  const ap=d.activePlayer||{},all=d.allPlayers||[];
  const me=all.find(p=>(ap.riotId&&p.riotId===ap.riotId)||(ap.summonerName&&p.summonerName===ap.summonerName))||all[0];
  if(!me)throw 0;
  const ids=[],pos={};
  all.filter(p=>p.team!==me.team).forEach(p=>{const id=idFromRaw(p.rawChampionName,p.championName);if(id){ids.push(id);if(p.position)pos[id]=p.position}});
  LINK.mode="live";
  LINK.live={gold:Math.floor(ap.currentGold||0),level:ap.level||me.level||0,items:(me.items||[]).map(x=>String(x.itemID)),time:Math.floor((d.gameData&&d.gameData.gameTime)||0)};
  LINK.msg="試合中 ・ リアルタイム連携";
  applyAuto(ids,Object.keys(pos).length?pos:null);
}
async function getJSON(u){const r=await fetch(u,{cache:"no-store"});if(!r.ok)throw 0;return r.json()}
let pollTimer=null;
async function poll(){
  clearTimeout(pollTimer);
  try{const d=await getJSON("/api/live");if(!d||!d.allPlayers||!d.allPlayers.length)throw 0;handleLive(d)}
  catch(e){
    try{const s=await getJSON("/api/cs");if(!s||!s.myTeam)throw 0;handleCS(s)}
    catch(e2){LINK.mode="idle";LINK.live=null;LINK.msg="LoL待機中 ・ ピックが始まると自動で入る";renderIfChanged()}
  }
  pollTimer=setTimeout(poll,1000);
}
render();
if(LOCAL){isExample=false;S={adc:null,sup:null};LINK.mode="idle";LINK.msg="LoLに接続中…";render();poll()}
})();
</script>
