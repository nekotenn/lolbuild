<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ツール置き場</title>
<style>
:root{--bg:#1a1d24;--panel:#232733;--line:#343a48;--text:#e9e3d6;--mute:#8f97a6;--accent:#b8293f;--ok:#6fae78;--gold:#c9a24a}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){--bg:#f4f2ee;--panel:#ffffff;--line:#ddd8cf;--text:#23262e;--mute:#6b7280}}
:root[data-theme="dark"]{--bg:#1a1d24;--panel:#232733;--line:#343a48;--text:#e9e3d6;--mute:#8f97a6}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"BIZ UDPGothic","Yu Gothic UI","Hiragino Sans","Meiryo",sans-serif;line-height:1.55}
.wrap{max-width:720px;margin:0 auto;padding:22px 16px 48px}
h1{font-size:22px;margin:0 0 4px}
.sub{color:var(--mute);font-size:13px;margin-bottom:20px}
.tool{background:var(--panel);border:1px solid var(--line);border-left:5px solid var(--accent);border-radius:10px;padding:14px;margin-bottom:12px}
.tool h2{font-size:17px;margin:0 0 4px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.st{font-size:11px;font-weight:400;border:1px solid currentColor;border-radius:9px;padding:0 7px;color:var(--ok)}
.st.wip{color:var(--gold)}
.tool p{margin:4px 0 10px;font-size:14px}
.links{display:flex;gap:8px;flex-wrap:wrap}
.links a{font-size:13px;color:var(--text);text-decoration:none;border:1px solid var(--line);border-radius:6px;padding:6px 10px}
.links a.main{border-color:var(--accent)}
.links a:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.how{font-size:12px;color:var(--mute);margin-top:8px}
</style>
</head>
<body>
<div class="wrap">
  <h1>ツール置き場</h1>
  <div class="sub">作ったツールの一覧。PCで動くものは、デスクトップのショートカットを押すと自動で最新版になります。</div>
  <div id="list"></div>
</div>
<script>
// ツールを足すときは、ここに1行足すだけ
const TOOLS=[
  {name:'LoLビルド（スウェイン・タムケンチ）',status:'使用中',
   desc:'敵5人からボットのビルドを出す。タンク／通常の切り替え、変わり種、重傷、ルーン比較。ピックを自動で読む。',
   open:'http://localhost:8765/',openLabel:'PCで開く（ショートカット起動中）',
   how:'デスクトップの「LoLビルド」を押す。データは毎週日曜10時に自動更新（auto_update_on.bat を実行済みの場合）。',
   src:'https://github.com/nekotenn/lolbuild'},
  {name:'ブラインドでの強さ（先出しできるキャラ）',status:'置き場へ移行待ち',
   desc:'Lolalyticsの相性データから、どのキャラが先出し（ブラインド）に強いかを順位で出す。縦画面版・使い込むキャラ選び・2体セットつき。',
   how:'今はPCの blind.bat から起動。次に直すときに、ここへ移して自動アップデート対応にします。'},
  {name:'LoL用サブモニター画面',status:'置き場へ移行待ち',
   desc:'縦置きサブモニター用。スクロールなし・タブ切り替え。ピック画面は本物のLoLのように左右のチームが並ぶ。',
   how:'次に直すときに、ここへ移します。'},
  {name:'ARAM／メイヘム ビルドサイト',status:'置き場へ移行待ち',
   desc:'ARAM・メイヘム用のビルド参照サイト。スマホ表示・評価軸・ランダムピックの改良を予定。',
   how:'次に直すときに、ここへ移します。'},
];
document.getElementById('list').innerHTML=TOOLS.map(t=>`<section class="tool">
  <h2>${t.name}<span class="st${t.status==='使用中'?'':' wip'}">${t.status}</span></h2>
  <p>${t.desc}</p>
  <div class="links">${t.open?`<a class="main" href="${t.open}">${t.openLabel||'開く'}</a>`:''}${t.src?`<a href="${t.src}">中身（GitHub）</a>`:''}</div>
  ${t.how?`<div class="how">${t.how}</div>`:''}
</section>`).join('');
</script>
</body>
</html>
