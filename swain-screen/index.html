<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>スウェイン</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;800&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=Dela+Gothic+One&display=swap">
<style>
/* ピック前半→ピック後半→ロード→試合 と自動で切り替わる。切り替えそのものを演出にする。色は赤（危ない・敵）と金（チャンス・自分）が主役 */
:root{
  --bg:#0a090c;--p1:#131016;--p2:#1b171f;--hair:#2b2631;--hair2:#3b3443;
  --fg:#f1ecf2;--mid:#bdb4c1;--dim:#766e7b;
  --red:#e3354f;--red-s:#e3354f22;--gold:#e8b85a;--gold-s:#e8b85a1c;--ally:#5b9cf0;--ally-s:#5b9cf01c;
  --num:"JetBrains Mono",ui-monospace,monospace;
  --jp:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
  --disp:"Dela Gothic One","Zen Kaku Gothic New",sans-serif;
  color-scheme:dark;
  font-size:clamp(12px,min(1.25vh,2.3vw),26px);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--fg)}
body{font-family:var(--jp);font-size:1rem;line-height:1.45;background-image:radial-gradient(70vmax 45vmax at 0% -10%,#e3354f1c,transparent 60%),radial-gradient(60vmax 35vmax at 110% 110%,#e8b85a12,transparent 60%)}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
[hidden]{display:none!important}
body::after{content:"";position:fixed;inset:0;pointer-events:none;transition:box-shadow .6s}
body.edge-gold::after{box-shadow:inset 0 0 0 .35rem var(--gold),inset 0 0 3rem #e8b85a40}
body.edge-red::after{box-shadow:inset 0 0 0 .35rem var(--red),inset 0 0 3rem #e3354f40}
.app{height:100vh;height:100dvh;display:grid;grid-template-rows:minmax(0,1fr) auto;max-width:66rem;margin:0 auto;padding:.9rem 1rem 0}
.stage{position:relative;overflow:hidden}
/* 画面遷移：進む方向に流れる */
.scr{position:absolute;inset:0;display:flex;flex-direction:column;gap:.8rem;opacity:0;visibility:hidden;transform:translateX(var(--from,4rem));transition:opacity .3s,transform .5s cubic-bezier(.2,.8,.2,1),visibility 0s .5s}
.scr.on{opacity:1;visibility:visible;transform:none;transition:opacity .35s,transform .55s cubic-bezier(.2,.8,.2,1),visibility 0s}
.scr.on .st{animation:rise .55s cubic-bezier(.2,.8,.2,1) both}
.scr.on .st:nth-child(2){animation-delay:.08s}.scr.on .st:nth-child(3){animation-delay:.16s}.scr.on .st:nth-child(4){animation-delay:.24s}.scr.on .st:nth-child(5){animation-delay:.32s}.scr.on .st:nth-child(6){animation-delay:.4s}
@keyframes rise{from{opacity:0;transform:translateY(1rem)}to{opacity:1;transform:none}}
/* 遷移のときに走る帯（場面名） */
.wipe{position:fixed;inset:0;pointer-events:none;z-index:9;display:grid;place-items:center;opacity:0}
.wipe.run{animation:wipe 1.1s cubic-bezier(.7,0,.2,1) both}
.wipe::before{content:"";position:absolute;inset:-10% -60%;background:linear-gradient(100deg,transparent 30%,var(--red) 45%,#000 50%,var(--gold) 55%,transparent 70%);transform:translateX(-100%)}
.wipe.run::before{animation:sweep 1.1s cubic-bezier(.7,0,.2,1) both}
.wipe span{position:relative;font-family:var(--disp);font-size:4rem;letter-spacing:.1em;text-shadow:0 0 2rem #000}
@keyframes wipe{0%{opacity:0}15%{opacity:1}75%{opacity:1}100%{opacity:0}}
@keyframes sweep{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
/* nav */
.nav{display:grid;grid-template-columns:repeat(4,1fr) auto;align-items:center;border-top:1px solid var(--hair);position:relative}
.nav button.t{background:none;border:0;padding:.5rem .2rem .7rem;cursor:pointer;color:var(--dim);display:flex;flex-direction:column;align-items:center;gap:.05rem;transition:color .2s}
.nav button.t b{font-family:var(--num);font-size:.55rem;letter-spacing:.14em}
.nav button.t span{font-size:.9rem;font-weight:700}
.nav button.t[aria-selected="true"]{color:var(--fg)}.nav button.t[aria-selected="true"] b{color:var(--red)}
.nav .bar{position:absolute;top:-1px;left:0;height:2px;width:calc((100% - var(--side,7rem))/4);background:linear-gradient(90deg,var(--red),var(--gold));transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.side{display:flex;gap:.4rem;align-items:center;padding-left:.6rem;width:7rem;justify-content:flex-end}
.side .st{font-size:.6rem;color:var(--dim);display:flex;align-items:center;gap:.3rem}
.side .st i{width:.45rem;height:.45rem;border-radius:50%;background:var(--dim)}
.side .st.live i{background:var(--gold);box-shadow:0 0 .5rem var(--gold)}
.side .play{background:none;border:1px solid var(--hair2);border-radius:999px;color:var(--mid);font-size:.65rem;padding:.15rem .55rem;cursor:pointer}
/* parts */
.pn{position:relative;background:linear-gradient(180deg,#151218f0,#110f14f0);border:1px solid var(--hair);border-radius:.25rem;padding:.8rem}
.pn::before,.pn::after{content:"";position:absolute;width:.55rem;height:.55rem;border:1px solid var(--gold);opacity:.6}
.pn::before{top:-1px;left:-1px;border-right:0;border-bottom:0}.pn::after{bottom:-1px;right:-1px;border-left:0;border-top:0}
.grow{flex:1;min-height:0;overflow:hidden}
.row{display:flex;flex-wrap:wrap;gap:.4rem;align-items:flex-start}
.lbl{font-size:.7rem;color:var(--dim);font-weight:700;margin:0 0 .45rem;letter-spacing:.06em}
.btn{background:var(--p2);border:1px solid var(--hair2);border-radius:.3rem;padding:.4rem .75rem;cursor:pointer;font-size:.8rem;color:var(--mid)}
.btn:hover{color:var(--fg);border-color:var(--gold)}
.btn.hot{background:var(--red);border-color:var(--red);color:#fff;font-size:1.1rem;padding:.7rem 1.3rem;font-weight:900}
.num{font-family:var(--num);font-variant-numeric:tabular-nums}
.pt{flex:none;overflow:hidden;background:var(--p2);display:grid;place-items:center;color:var(--dim);clip-path:polygon(16% 0,100% 0,100% 84%,84% 100%,0 100%,0 16%)}
.pt img{width:100%;height:100%;display:block}
.it{display:inline-flex;flex-direction:column;align-items:center;width:4.4rem;text-align:center;position:relative}
.it img{width:3.3rem;height:3.3rem;border-radius:.25rem;border:1px solid var(--hair2);display:block}
.it small{font-size:.6rem;line-height:1.2;color:var(--mid);margin-top:.2rem}
.it.own img{opacity:.25;filter:grayscale(1)}
.it.own::after{content:"✓";position:absolute;top:.8rem;font-weight:900;color:var(--fg);font-size:1.2rem}
.it.next img{border:3px solid var(--gold);box-shadow:0 0 1rem #e8b85a55}
.ar{color:var(--dim);padding-top:1.1rem}
.empty{color:var(--dim);text-align:center;padding:2rem 1rem}
/* ===== 01 PICK（LoLの選択画面の形） ===== */
.cs{flex:1;min-height:0;display:grid;grid-template-columns:1fr auto 1fr;gap:.8rem}
.side5{display:flex;flex-direction:column;gap:.5rem;min-height:0}
.side5 h3{margin:0;font-size:.75rem;letter-spacing:.14em;font-family:var(--num)}
.side5.a h3{color:var(--ally)}.side5.e h3{color:var(--red);text-align:right}
.ps{flex:1;min-height:0;display:flex;align-items:center;gap:.7rem;border:1px solid var(--hair);background:linear-gradient(90deg,var(--ally-s),transparent);padding:.4rem;position:relative;overflow:hidden}
.side5.e .ps{flex-direction:row-reverse;background:linear-gradient(270deg,var(--red-s),transparent);text-align:right}
.ps .pt{height:100%;max-height:6.2rem;aspect-ratio:1}
.ps .nm{min-width:0;flex:1}
.ps .nm b{display:block;font-size:1.25rem;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ps .nm span{font-family:var(--num);font-size:.6rem;color:var(--dim);letter-spacing:.12em}
.ps .tags{display:flex;gap:.25rem;flex-wrap:wrap;margin-top:.2rem}
.side5.e .ps .tags{justify-content:flex-end}
.tg{font-size:.6rem;font-weight:700;border:1px solid currentColor;border-radius:.15rem;padding:0 .3rem;color:var(--mid)}
.tg.r{color:var(--red)}.tg.g{color:var(--gold)}
.ps.me{border-color:var(--gold);background:linear-gradient(90deg,var(--gold-s),transparent)}
.ps.hover .pt img{opacity:.35;filter:grayscale(.6)}
.ps.empty .pt{background:repeating-linear-gradient(45deg,#1b171f 0 .4rem,#151218 .4rem .8rem)}
.ps.in{animation:lockin .7s cubic-bezier(.2,.9,.2,1.2) both}
.ps.in::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,#fff6,transparent);transform:translateX(-100%);animation:shine .7s ease-out .1s both}
@keyframes lockin{0%{opacity:0;transform:scale(1.08);filter:brightness(2)}100%{opacity:1;transform:none;filter:none}}
@keyframes shine{to{transform:translateX(100%)}}
.mid{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.6rem;width:6.5rem}
.vsx{font-family:var(--disp);font-size:2.2rem;color:var(--mid)}
.timer{font-family:var(--num);font-size:2.2rem;font-weight:800;color:var(--fg)}
.timer.low{color:var(--red)}
.phase{font-size:.7rem;color:var(--dim);text-align:center}
.mixv{width:.7rem;flex:1;max-height:14rem;display:flex;flex-direction:column;border-radius:1px;overflow:hidden;background:var(--p2)}
.mixv i{display:block;width:100%}.mixv .ad{background:#e07a3a}.mixv .ap{background:#7d6cf0}.mixv .tk{background:#56505c}
.mixwrap{display:flex;gap:.5rem;align-items:stretch;height:12rem}
.mixwrap small{writing-mode:vertical-rl;font-size:.6rem;color:var(--dim)}
.legend{font-size:.55rem;color:var(--dim);text-align:center;line-height:1.6}
.legend i{display:inline-block;width:.5rem;height:.5rem;margin-right:.2rem}
.edit{display:none}.editing .edit{display:block}
#q{width:100%;background:var(--p1);border:1px solid var(--hair2);border-radius:.25rem;padding:.55rem .7rem}
.sugg{display:flex;flex-wrap:wrap;gap:.35rem;margin-top:.4rem;min-height:1.8rem}
.sugg button{display:flex;align-items:center;gap:.35rem;background:var(--p2);border:1px solid var(--hair2);border-radius:.25rem;padding:.12rem .6rem .12rem .12rem;cursor:pointer;font-size:.85rem}
.sugg button:first-child{border-color:var(--gold)}
.sugg img{width:1.5rem;height:1.5rem;border-radius:.15rem}
.ps.tgt{outline:2px solid var(--gold)}
.foot{display:flex;align-items:center;gap:.5rem;font-size:.65rem;color:var(--dim)}
.foot .sp{flex:1}
/* ===== 02 LOCK（ピック後半：決める） ===== */
.faces{display:grid;grid-template-columns:1fr auto 1fr;gap:.6rem;align-items:center}
.faces .f5{display:flex;gap:.3rem}.faces .f5.e{justify-content:flex-end}
.faces .pt{width:3.2rem;height:3.2rem}
.faces .pt.me{outline:2px solid var(--gold);outline-offset:1px}
.chips{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.5rem}
.chip{display:flex;align-items:center;gap:.6rem;border:1px solid var(--hair2);background:var(--p1);border-radius:.25rem;padding:.55rem .6rem}
.chip .ic{display:flex;gap:-.4rem}
.chip .ic .pt{width:2.4rem;height:2.4rem;margin-right:-.5rem;border:2px solid var(--p1)}
.chip .tx{min-width:0}
.chip .k{font-size:.6rem;color:var(--dim);font-weight:700}
.chip .v{font-size:1.2rem;font-weight:900;line-height:1.2}
.chip.r{border-color:var(--red);background:var(--red-s)}.chip.r .v{color:var(--red)}
.chip.g{border-color:var(--gold)}.chip.g .v{color:var(--gold)}
.chip .big{font-family:var(--disp);font-size:1.6rem;width:2.4rem;text-align:center;color:var(--mid)}
.decide{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
.dc{border:1px solid var(--hair2);background:var(--p1);border-radius:.25rem;padding:.7rem;display:flex;flex-direction:column;gap:.45rem}
.dc .k{font-size:.65rem;color:var(--dim);font-weight:700}
.dc .m{display:flex;align-items:center;gap:.6rem}
.dc .m img{width:3.6rem;height:3.6rem;border-radius:50%;background:#000}
.dc .m img.sq{width:3rem;height:3rem;border-radius:.25rem}
.dc .n{font-size:1.4rem;font-weight:900;line-height:1.15}
.dc .w{font-family:var(--num);font-size:.75rem;color:var(--gold)}
.dc .a{display:flex;align-items:center;gap:.45rem;border-top:1px dashed var(--hair2);padding-top:.45rem;font-size:.75rem;color:var(--mid)}
.dc .a img{width:1.8rem;height:1.8rem;border-radius:50%}
.dc .a b{color:var(--fg)}
.dc.full{grid-column:1/-1;flex-direction:row;align-items:center;gap:1rem}
.scr.on .dc{animation:flipin .6s cubic-bezier(.2,.8,.2,1) both}
.scr.on .dc:nth-child(2){animation-delay:.15s}.scr.on .dc:nth-child(3){animation-delay:.3s}
@keyframes flipin{0%{opacity:0;transform:perspective(40rem) rotateX(-60deg)}100%{opacity:1;transform:none}}
/* ===== 03 LOAD ===== */
.cards{display:flex;flex-direction:column;gap:1rem;flex:1;justify-content:center}
.card{border:1px solid var(--hair2);border-left:.35rem solid var(--fg);background:linear-gradient(90deg,#1a1419,#100e13);padding:1.2rem 1.3rem;border-radius:.2rem;position:relative;overflow:hidden;min-height:9rem;display:flex;align-items:center;gap:1.1rem}
.card .pt{width:6.5rem;height:6.5rem}
.card .n{font-size:.75rem;color:var(--dim);font-weight:700}
.card .t{font-family:var(--disp);font-size:2.3rem;line-height:1.15;margin:.2rem 0}
.card.r{border-left-color:var(--red)}.card.r .n{color:var(--red)}
.card.g{border-left-color:var(--gold)}.card.g .n{color:var(--gold)}
.scr.on .card{animation:slam .6s cubic-bezier(.2,.9,.2,1.2) both}
.scr.on .card:nth-child(2){animation-delay:.7s}.scr.on .card:nth-child(3){animation-delay:1.4s}
@keyframes slam{0%{opacity:0;transform:translateX(-2.5rem) scale(1.06);filter:blur(8px)}65%{opacity:1;filter:blur(0)}100%{transform:none}}
/* ===== 04 MATCH ===== */
.mh{display:flex;align-items:center;gap:1rem}
.clock{font-family:var(--num);font-weight:800;font-size:5rem;line-height:.9;color:var(--gold);letter-spacing:-.03em;text-shadow:0 0 1.5rem #e8b85a33}
.ph{flex:1;min-width:0}
.ph .t{font-family:var(--disp);font-size:2rem;line-height:1.1}
.ph .s{font-size:1rem;color:var(--mid);margin-top:.2rem}
.ph .s b{font-family:var(--num);color:var(--fg)}
.tl{position:relative;height:2.2rem;margin:.6rem .4rem 0;border-top:1px solid var(--hair2)}
.tl .fill{position:absolute;top:-2px;left:0;height:3px;background:linear-gradient(90deg,var(--red),var(--gold));transition:width 1s linear}
.tl .mk{position:absolute;top:-.35rem;transform:translateX(-50%);font-size:.65rem;color:var(--mid);text-align:center;white-space:nowrap;line-height:1.15}
.tl .mk::before{content:"";display:block;width:1px;height:.55rem;background:var(--hair2);margin:0 auto .15rem}
.tl .mk em{font-style:normal;font-family:var(--num);color:var(--dim);display:block;font-size:.6rem}
.tl .mk.done{opacity:.35}
.tl .now{position:absolute;top:-.45rem;width:.7rem;height:.7rem;transform:translateX(-50%) rotate(45deg);background:var(--gold);box-shadow:0 0 .6rem var(--gold);transition:left 1s linear}
.nxt{display:flex;align-items:center;gap:.8rem}
.nxt .ic{width:2.6rem;height:2.6rem;display:grid;place-items:center;border:1px solid var(--hair2);font-family:var(--disp);font-size:1.2rem;color:var(--gold);flex:none}
.nxt .bx{flex:1;min-width:0}
.nxt .n{font-size:1.1rem;font-weight:900}.nxt .n small{font-family:var(--num);color:var(--dim);font-weight:500;margin-left:.4rem}
.nxt .cd{font-family:var(--num);font-weight:800;font-size:2.2rem;color:var(--fg)}
.nxt .bar{height:.3rem;background:var(--p2);margin-top:.3rem;overflow:hidden}
.nxt .bar i{display:block;height:100%;background:var(--mid);transition:width 1s linear}
.nxt.near .cd,.nxt.near .n{color:var(--gold)}.nxt.near .bar i{background:var(--gold)}.nxt.near{border-color:var(--gold)}
.hero{perspective:60rem}
.big{list-style:none;margin:0;padding:0}
.big li{display:flex;gap:.7rem;align-items:center;font-size:1.65rem;line-height:1.25;padding:.4rem 0;font-weight:700;color:var(--mid)}
.big li:first-child{font-family:var(--disp);font-weight:400;font-size:2.7rem;color:var(--fg);padding-bottom:.6rem}
.big li .pt{width:3.4rem;height:3.4rem}
.big li .mk2{font-family:var(--num);font-size:.7rem;font-weight:800;padding:.1rem .35rem;border:1px solid currentColor;border-radius:.15rem;flex:none;color:var(--gold)}
.big li .mk2.r{color:var(--red)}
.big em{font-style:normal;color:var(--gold)}
.big .red em{color:var(--red)}
.hero.swap .big{animation:door .6s cubic-bezier(.2,.8,.2,1) both;transform-origin:left center}
@keyframes door{0%{transform:rotateY(-80deg);opacity:0}100%{transform:none;opacity:1}}
.nextp{display:flex;gap:.6rem;align-items:baseline;margin-top:.5rem;font-size:.9rem;color:var(--dim)}
.nextp b{font-family:var(--disp);font-weight:400;color:var(--mid);font-size:1.05rem}
.foes{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:.45rem}
.foe{position:relative;background:none;border:1px solid var(--hair2);padding:0;cursor:pointer;aspect-ratio:1;overflow:hidden;border-radius:.2rem}
.foe img{width:100%;height:100%;display:block;transition:filter .3s}
.foe .r6{position:absolute;right:.15rem;top:.15rem;font-family:var(--disp);font-size:.75rem;width:1.35rem;height:1.35rem;display:grid;place-items:center;background:#000c;color:var(--dim);border:1px solid var(--hair2)}
.foe .r6.on{background:var(--red);color:#fff;border-color:var(--red)}
.foe .lv{position:absolute;left:.15rem;bottom:.15rem;font-family:var(--num);font-size:.7rem;font-weight:800;background:#000c;padding:0 .25rem}
.foe .bt{position:absolute;left:.15rem;top:.15rem;font-family:var(--num);font-size:.5rem;background:var(--red);color:#fff;padding:0 .2rem}
.foe .fl{position:absolute;inset:auto 0 0 0;background:var(--gold);color:#000;font-family:var(--num);font-weight:800;font-size:.85rem;text-align:center}
.foe.nf{border-color:var(--gold);box-shadow:inset 0 0 0 3px var(--gold)}
.foe.dead img{filter:grayscale(1) brightness(.35)}
.foe .dd{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--num);font-weight:800;color:var(--mid)}
.buy{display:flex;align-items:center;gap:.8rem;flex-wrap:wrap}
.gold{font-family:var(--num);font-size:1.6rem;font-weight:800;color:var(--gold)}
.need{font-size:.95rem;color:var(--mid)}.need b{color:var(--fg)}
.ctl{display:flex;gap:.35rem;flex-wrap:wrap;align-items:center}
.ctl .sp{flex:1}
.startbx{text-align:center;padding:.6rem 0}
/* 展開（死亡中） */
.exh{display:flex;align-items:baseline;gap:1rem}
.exh .t{font-family:var(--disp);font-size:2.2rem}.exh .c{font-family:var(--num);font-size:2.2rem;font-weight:800;color:var(--red)}
.tug{display:grid;grid-template-columns:auto 1fr auto;gap:.6rem;align-items:center;margin-top:.6rem;font-size:.75rem;color:var(--dim)}
.tug .b{position:relative;height:.55rem;background:var(--p2)}
.tug .b::before{content:"";position:absolute;left:50%;top:-.25rem;bottom:-.25rem;width:1px;background:var(--mid)}
.tug .b i{position:absolute;top:0;bottom:0;background:var(--gold)}.tug .b i.m{background:var(--red)}
.sugs{list-style:none;margin:.6rem 0 0;padding:0;font-size:1rem}
.sugs li{padding:.3rem 0;border-bottom:1px solid #ffffff0a}.sugs b{color:var(--gold)}
.plan{list-style:none;margin:0;padding:0}
.plan li{padding:.45rem 0;border-bottom:1px solid #ffffff0a;font-size:1rem;color:var(--mid)}
.plan li.c{font-size:1.2rem;font-weight:900;color:var(--fg)}
.plan li b{color:var(--gold)}
.intro{position:absolute;inset:0;display:grid;place-items:center;z-index:3;pointer-events:none}
.intro b{font-family:var(--disp);font-size:5rem;color:var(--gold);animation:introx 1.4s cubic-bezier(.2,.8,.2,1) both}
@keyframes introx{0%{opacity:0;transform:scale(1.6);letter-spacing:.5em}30%{opacity:1;transform:none;letter-spacing:.08em}75%{opacity:1}100%{opacity:0}}

 const asCarry=L.some(c=>has(c,'a'));
 const heal=L.some(c=>has(c,'h'))||COND.heal;

 const pokeAP=L.some(c=>has(c,'o')), dotAP=L.some(c=>has(c,'t'));

 const enemyCC=L.some(c=>has(c,'c'));
 let b, why;
 if(P>=2){b='A';why='苦手な相手が2体。レーンで削られるので、データで勝てている現行型'}
 else if(P===1&&!(E===1&&COND.allyCC)){b='A';why='苦手な相手がいる。体力を積む型はレーンで削られるので現行型'}
 else if(P===1){b='B';why='苦手な相手が1体いるが、相手のもう1体が近づいてくるうえ味方サポにCCがある。序盤は現行型、後半に心の鋼'}
 else if(pct){b='R';why='体力割合ダメージがいる。体力を積むほど相手のダメージも伸びるので、防御を積む'}
 else if(E===2){ if(adHeavy&&!bothRanged){b='D';why='2体とも近づいてくるうえ、物理ダメージ中心。心の鋼が一番貯まり、フローズンハートも刺さる'} else {b='C';why='2体とも近づいてくる長期戦レーン。体力で回すロマン型が一番楽しい'} }

}

function nextBuy(core,boots,owned,gold){
 const alias={'3121':'3119'};
 const pool=owned.map(x=>alias[x]||x);
 const take=id=>{const i=pool.indexOf(id);if(i>=0){pool.splice(i,1);return true}return false};
 const g=id=>ITEM[id]?ITEM[id].g:0;
 const walk=(x,top)=>{
  if(!top&&take(x)) return {own:g(x),units:[]};
  const f=(ITEM[x]&&ITEM[x].f)||[];
  if(!f.length) return {own:0,units:[x]};
  const r=f.map(c=>walk(c,false)); const own=r.reduce((s,v)=>s+v.own,0);
  if(!top&&own===0) return {own:0,units:[x]};
  return {own,units:r.flatMap(v=>v.units)};
 };
 const order=[core[0],boots,...core.slice(1)];
 for(const id of order){
  if(take(id)) continue;
  const w=walk(id,true); const remaining=g(id)-w.own;
  return {target:id,remaining,units:w.units,canFinish:gold>=remaining};
 }
 return null;
}

 setTimeout(()=>{TIMER=null;go(2,true);},t1+6000);
 setTimeout(()=>{T.start=Date.now();T.offset=262;go(3,true);},t1+11500);
 setTimeout(()=>{T.fl[botPair().sup]=gameTime();renderGame();},t1+17000);
 setTimeout(()=>{DEMO=false;render();},t1+24000);
}

/* ===== 入力 ===== */
function matches(v){v=norm(v);if(!v)return[];const all=Object.values(ALLCH);
 const m=all.filter(c=>norm(c[1]).startsWith(v)||c[0].toLowerCase().startsWith(v));
 return (m.length?m:all.filter(c=>norm(c[1]).includes(v)||c[0].toLowerCase().includes(v))).slice(0,6);}
function addChamp(id){isExample=false;LINK.manual=true;
 if(ST.tgt!=null){ST.ally[ST.tgt]=id;ST.tgt=null;}
 else{if(ST.enemy.includes(id))return;if(ST.enemy.length>=5)ST.enemy.shift();ST.enemy.push(id);}
 QV='';FOCUSQ=true;render();}
function renderSugg(){const s=document.getElementById('sugg');if(s)s.innerHTML=matches(QV).map(c=>`<button type="button" data-id="${c[0]}">${CI[c[0]]?`<img src="${CI[c[0]]}" alt="">`:''}${c[1]}</button>`).join('')}
const s0=document.getElementById('s0');
s0.addEventListener('input',e=>{if(e.target.id==='q'){QV=e.target.value;renderSugg();}});
s0.addEventListener('keydown',e=>{if(e.target.id!=='q')return;
 if(e.key==='Enter'){const m=matches(QV);if(m[0])addChamp(m[0][0]);e.preventDefault();}
 else if(e.key==='Backspace'&&!QV&&ST.enemy.length){ST.enemy.pop();FOCUSQ=true;render();}
 else if(e.key==='Escape'){QV='';e.target.blur();renderSugg();}});
s0.addEventListener('click',e=>{
 if(e.target.closest('#editbtn')){ST.edit=!ST.edit;FOCUSQ=ST.edit;render();return}
 const sg=e.target.closest('#sugg [data-id]');if(sg){addChamp(sg.dataset.id);return}
 const s=e.target.closest('.ps');if(!s||!ST.edit)return;const i=+s.dataset.i;
 if(s.dataset.side==='a'){if(i===3)return;ST.tgt=ST.tgt===i?null:i;FOCUSQ=true;render();return;}
 const id=ST.enemy[i];if(!id){ST.tgt=null;FOCUSQ=true;render();return}
 const bp=botPair();const cur=ST.tag[id]||(bp.adc===id?'adc':bp.sup===id?'sup':'');
 const nx=cur==='adc'?'sup':cur==='sup'?'none':'adc';
 Object.keys(ST.tag).forEach(k=>{if(ST.tag[k]===nx)delete ST.tag[k]});ST.tag[id]=nx;LINK.manual=true;render();});
s0.addEventListener('contextmenu',e=>{const s=e.target.closest('.ps');if(!s||!ST.edit)return;e.preventDefault();const i=+s.dataset.i;
 if(s.dataset.side==='e'&&ST.enemy[i]){delete ST.tag[ST.enemy[i]];ST.enemy.splice(i,1);}else if(s.dataset.side==='a'&&i!==3){ST.ally[i]=null;}render();});
document.addEventListener('click',e=>{
 if(e.target.closest('#play')){playDemo();return}
 const g=e.target.closest('[data-go]');if(g){go(+g.dataset.go);return}
 const b=e.target.closest('#s3 [data-t],#s3 [data-fl]');if(!b)return;
 if(b.dataset.fl)flashToggle(b.dataset.fl);else timerAct(b.dataset.t);});
document.addEventListener('keydown',e=>{
 if(e.target.closest&&e.target.closest('input'))return;
 if(['1','2','3','4'].includes(e.key)){go(+e.key-1);return}
 if(ST.scr===3){const bp=botPair();
  if(e.key==='F9'){flashToggle(bp.adc);e.preventDefault();return}
  if(e.key==='F10'){flashToggle(bp.sup);e.preventDefault();return}
  const m={s:'go',S:'go',ArrowLeft:'m10',ArrowRight:'p10',d:'drg',D:'drg',e:'exp',E:'exp',F11:'exp'}[e.key];if(m){timerAct(m);e.preventDefault()}}
});
setInterval(()=>{if(ST.scr===3)renderGame();else if(ST.scr===0&&TIMER)renderPick();},1000);
/* ===== LoL連携（zipのツールから開いたときだけ） ===== */
const LOCAL=['localhost','127.0.0.1'].includes(location.hostname);
const LINK={mode:'',manual:false,live:null,msg:''};
let teamKey='',wasCS=false;
const POSI={top:0,jungle:1,middle:2,bottom:3,utility:4,TOP:0,JUNGLE:1,MIDDLE:2,BOTTOM:3,UTILITY:4};
function applyTeams(enemy,ally,pos){const key=JSON.stringify([enemy,ally]);if(key===teamKey)return false;teamKey=key;
 if(!LINK.manual){ST.enemy=enemy.slice(0,5);ST.pos=pos;ST.tag={};ally.forEach((id,i)=>{if(i!==3)ST.ally[i]=id||null});}isExample=false;return true;}
function handleCS(s){
 const toId=k=>ALLCH[String(k)]?ALLCH[String(k)][0]:null;
 const enemy=(s.theirTeam||[]).map(p=>toId(p.championId)).filter(Boolean);
 const ally=[null,null,null,'Swain',null];HOVER={};
 (s.myTeam||[]).forEach(p=>{if(p.cellId===s.localPlayerCellId)return;const i=POSI[p.assignedPosition];if(i==null||i===3)return;
  const id=toId(p.championId);if(id)ally[i]=id;else{const h=toId(p.championPickIntent);if(h)HOVER[i]=h;}});
 const tm=s.timer||{};TIMER=tm.adjustedTimeLeftInPhase!=null?{left:tm.adjustedTimeLeftInPhase/1000,at:Date.now(),phase:tm.phase}:null;
 const first=!wasCS;wasCS=true;LINK.mode='cs';LINK.live=null;LINK.msg='ピック中';
 const changed=applyTeams(enemy,ally,null);
 const want=tm.phase==='FINALIZATION'?1:0;
 if(first||ST.scr!==want&&!(want===0&&ST.scr===1)) go(want,true); else if(changed) render();
}
function handleLive(d){
 const ap=d.activePlayer||{},all=d.allPlayers||[];
 const me=all.find(p=>(ap.riotId&&p.riotId===ap.riotId)||(ap.summonerName&&p.summonerName===ap.summonerName))||all[0];if(!me)throw 0;
 const enemies=all.filter(p=>p.team!==me.team),pos={};
 const enemy=enemies.map(p=>{const id=idFromRaw(p.rawChampionName,p.championName);if(id&&p.position)pos[id]=p.position;return id}).filter(Boolean);
 const ally=[null,null,null,'Swain',null];
 all.filter(p=>p.team===me.team&&p!==me).forEach(p=>{const id=idFromRaw(p.rawChampionName,p.championName);const i=POSI[p.position];if(id&&i!=null&&i!==3)ally[i]=id;});
 const igold=p=>(p.items||[]).reduce((s,x)=>s+((ITEM[String(x.itemID)]&&ITEM[String(x.itemID)].g)||x.price||0)*(x.count||1),0);
 const foes={};
 enemies.forEach(p=>{const id=idFromRaw(p.rawChampionName,p.championName);if(!id)return;const sc=p.scores||{};
  foes[id]={lv:p.level||0,dead:!!p.isDead,resp:p.respawnTimer||0,k:sc.kills||0,d:sc.deaths||0,gold:igold(p)};});
 const ev=((d.events&&d.events.Events)||[]);
 const lastDrg=ev.filter(e=>e.EventName==='DragonKill').map(e=>e.EventTime).pop();
 const first=!LINK.live;const sc=me.scores||{};
 LINK.mode='live';LINK.live={dead:!!me.isDead,resp:me.respawnTimer||0,gold:Math.floor(ap.currentGold||0),level:ap.level||me.level||0,items:(me.items||[]).map(x=>String(x.itemID)),myGold:igold(me),k:sc.kills||0,d:sc.deaths||0,foes,time:(d.gameData&&d.gameData.gameTime)||0};
 if(lastDrg!=null)T.drg=lastDrg;
 LINK.msg='試合中';wasCS=false;
 applyTeams(enemy,ally,Object.keys(pos).length?pos:null);
 if(first&&ST.scr!==3){CUR=plan();go(3,true);}else{CUR=plan();renderGame();}
}
async function getJSON(u){const r=await fetch(u,{cache:'no-store'});if(!r.ok)throw 0;return r.json()}
async function poll(){
 try{const d=await getJSON('/api/live');if(!d||!d.allPlayers||!d.allPlayers.length)throw 0;handleLive(d);}
 catch(e){if(LINK.live){LINK.live=null;LINK.manual=false;teamKey='';T.fl={};T.drg=null;saveT();SEEN=new Set();}
  try{const s=await getJSON('/api/cs');if(!s||!s.myTeam)throw 0;handleCS(s);}
  catch(e2){if(wasCS){wasCS=false;TIMER=null;LINK.mode='cs';LINK.msg='ロード中';go(2,true);}
   else if(LINK.mode!=='idle'&&LINK.msg!=='ロード中'){LINK.mode='idle';LINK.msg='待機中';render();}}}
 setTimeout(poll,1000);
}
async function pollKeys(){try{const k=await getJSON('/api/keys');(k.keys||[]).forEach(x=>{const bp=botPair();if(x==='adc')flashToggle(bp.adc);else if(x==='sup')flashToggle(bp.sup);else if(x==='exp')timerAct('exp');});}catch(e){}setTimeout(pollKeys,300);}
ST.enemy=['Samira','Leona','Ahri','LeeSin','Darius'];ST.ally=['Ornn','Vi','Orianna','Swain','Nautilus'];isExample=true;
SEEN=new Set(ST.enemy.map(x=>'e'+x).concat(ST.ally.map(x=>'a'+x)));
go(0);
if(LOCAL){isExample=false;ST.enemy=[];ST.ally=[null,null,null,'Swain',null];SEEN=new Set();LINK.mode='idle';LINK.msg='接続中';render();poll();pollKeys();}
